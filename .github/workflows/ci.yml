name: AgentIQ CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-checks:
    name: Backend Lint, Type Check & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: agentiq_db
          POSTGRES_USER: agentiq_user
          POSTGRES_PASSWORD: agentiq_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linting
        run: |
          ruff check backend tests

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+psycopg://agentiq_user:agentiq_password@localhost:5432/agentiq_db
          ANALYTICS_DATABASE_URL: postgresql+psycopg://agentiq_user:agentiq_password@localhost:5432/agentiq_db
          ENVIRONMENT: test
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
        run: |
          pytest -v

      - name: Run Benchmark Evaluation Runner
        env:
          DATABASE_URL: postgresql+psycopg://agentiq_user:agentiq_password@localhost:5432/agentiq_db
          ANALYTICS_DATABASE_URL: postgresql+psycopg://agentiq_user:agentiq_password@localhost:5432/agentiq_db
          PYTHONPATH: backend
        run: |
          python backend/app/evaluation/runner.py

  frontend-checks:
    name: Frontend Tests, Type Check & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Vitest Unit Tests
        working-directory: ./frontend
        run: npm test

      - name: Run TypeScript Type Check & Vite Build
        working-directory: ./frontend
        run: npm run build

  docker-build:
    name: Docker Image Verification
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t agentiq-backend:test -f backend/Dockerfile .

      - name: Build Frontend Docker Image
        working-directory: ./frontend
        run: |
          docker build -t agentiq-frontend:test -f Dockerfile .
