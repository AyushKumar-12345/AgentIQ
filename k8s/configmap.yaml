apiVersion: v1
kind: ConfigMap
metadata:
  name: agentiq-config
  namespace: agentiq
  labels:
    app.kubernetes.io/name: agentiq-config
    app.kubernetes.io/part-of: agentiq-system
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  ALLOWED_ORIGINS: "*"
  LLM_PROVIDER: "mock"
  EMBEDDING_PROVIDER: "mock"
  CHUNK_SIZE: "500"
  CHUNK_OVERLAP: "100"
  DEFAULT_TOP_K: "4"
  DEFAULT_SIMILARITY_THRESHOLD: "0.45"
  AGENT_MAX_STEPS: "4"
  AGENT_TIMEOUT_SECONDS: "15"
  SQL_QUERY_TIMEOUT_MS: "3000"
  SQL_MAX_ROWS: "50"
  UPLOAD_DIR: "/app/uploads"
  MAX_UPLOAD_SIZE_BYTES: "15728640"
