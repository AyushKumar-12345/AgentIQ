apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentiq-frontend
  namespace: agentiq
  labels:
    app.kubernetes.io/name: agentiq-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: agentiq-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agentiq-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentiq-frontend
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: agentiq-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: agentiq-frontend
  namespace: agentiq
  labels:
    app.kubernetes.io/name: agentiq-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: agentiq-system
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app.kubernetes.io/name: agentiq-frontend

