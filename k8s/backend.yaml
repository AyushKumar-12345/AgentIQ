apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentiq-backend
  namespace: agentiq
  labels:
    app.kubernetes.io/name: agentiq-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: agentiq-system
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: agentiq-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentiq-backend
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          image: agentiq-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: agentiq-config
            - secretRef:
                name: agentiq-secret
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads
      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: agentiq-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: agentiq-backend
  namespace: agentiq
  labels:
    app.kubernetes.io/name: agentiq-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: agentiq-system
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app.kubernetes.io/name: agentiq-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentiq-backend-hpa
  namespace: agentiq
  labels:
    app.kubernetes.io/name: agentiq-backend-hpa
    app.kubernetes.io/part-of: agentiq-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentiq-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
