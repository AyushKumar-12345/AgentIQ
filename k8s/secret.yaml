apiVersion: v1
kind: Secret
metadata:
  name: agentiq-secret
  namespace: agentiq
  labels:
    app.kubernetes.io/name: agentiq-secret
    app.kubernetes.io/part-of: agentiq-system
type: Opaque
stringData:
  POSTGRES_DB: "agentiq"
  POSTGRES_USER: "agentiq"
  POSTGRES_PASSWORD: "agentiq_secure_pass"
  DATABASE_URL: "postgresql+psycopg://agentiq:agentiq_secure_pass@agentiq-postgres:5432/agentiq"
  ANALYTICS_DATABASE_URL: "postgresql+psycopg://agentiq:agentiq_secure_pass@agentiq-postgres:5432/agentiq"
  SECRET_KEY: "agentiq_production_secure_jwt_secret_key_minimum_32_characters"
  OPENAI_API_KEY: ""
  GEMINI_API_KEY: ""

