apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentiq-ingress
  namespace: agentiq
  labels:
    app.kubernetes.io/name: agentiq-ingress
    app.kubernetes.io/part-of: agentiq-system
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentiq-backend
                port:
                  number: 8000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: agentiq-backend
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: agentiq-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentiq-frontend
                port:
                  number: 80

