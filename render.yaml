# ==============================================================================
# AgentIQ Render Blueprint Configuration (Infrastructure-as-Code)
# Deploy with 1-click on https://dashboard.render.com/blueprints
# ==============================================================================

services:
  # 1. FastAPI Backend Application Service
  - type: web
    name: agentiq-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: backend
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: mock
      - key: DEFAULT_SIMILARITY_THRESHOLD
        value: "0.45"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. Vite + React Frontend Static Site
  - type: web
    name: agentiq-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: "npm --prefix frontend install && npm --prefix frontend run build"
    staticPublishPath: "./frontend/dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: agentiq-backend
          property: host
